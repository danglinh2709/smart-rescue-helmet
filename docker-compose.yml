services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 5",
        ]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      DEVICE_OFFLINE_TIMEOUT_SECONDS: ${DEVICE_OFFLINE_TIMEOUT_SECONDS:-10}
      DEVICE_OFFLINE_CHECK_INTERVAL_SECONDS: ${DEVICE_OFFLINE_CHECK_INTERVAL_SECONDS:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      SIMULATOR_DEVICE_ID: ${SIMULATOR_DEVICE_ID}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      SIMULATOR_TELEMETRY_INTERVAL: ${SIMULATOR_TELEMETRY_INTERVAL}
      SIMULATOR_STATUS_INTERVAL: ${SIMULATOR_STATUS_INTERVAL}
      SIMULATOR_HEALTH_INTERVAL: ${SIMULATOR_HEALTH_INTERVAL}
      SIMULATOR_SOURCE: SIMULATOR
      SIMULATOR_MQTT_PUBLISH_ENABLED: ${SIMULATOR_MQTT_PUBLISH_ENABLED:-true}
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  postgres_data:
